known_limitations:
  - Lệch trái 16/17 shot và nặng-trên 15/17. Chữ Việt neo trái ở 93 hoặc 140 nên
    lệch trái là hệ quả của chữ viết. Biên độ trên/dưới trải 16–83% và ba khung
    nặng dưới đều nặng dưới VÌ NGHĨA. Không đuổi theo 50/50 — đó chính là luân
    phiên máy móc đã bị cấm.
  - Camera tĩnh 17/17. Không phải nguyên tắc, chỉ là chưa shot nào có lý do di
    chuyển.
  - Video thưa. Mực trung bình 2.56 trên nền; hai shot gần như trống là chủ ý
    (s02-eliminate giữ mỗi người sống sót, s09 giữ mỗi cái lỗ).
rejected_devices:
  - device: writing_the_function_name_into_an_abstract_table
    why_rejected: '`req.principal` và `assertMember` là code thật và thuộc về
      s03/s04, nơi chúng được viết ra. Mang vào bảng năm đường, chúng thôi nghĩa
      "đường này chịu một quyết định" và thành "đường này gọi hàm đó" — đúng
      never_say số 5 — đồng thời đặt hai token của H2 cạnh nhau, cho không cách
      đọc thay-thế. Cột nay là dấu hiện diện, tiêu đề cột gánh nghĩa.'
  - device: declaring_a_spatial_operation_in_a_comment_instead_of_performing_it
    why_rejected: Bản đầu của s08 đặt `width` lên container mà chữ không lấp đầy rồi
      ghi trong comment rằng phạm vi khẳng định co lại. Trên màn hình không gì
      co cả, và cv gate báo sạch vì không checker nào đọc ý định. Cùng loại lỗi
      với match cut 03→04 từng bị khẳng định thay vì đo. Bản sau dùng dải chia
      ba ô, hai ô scaleX về 0.
  - device: a_repeated_vietnamese_phrase_down_a_monospace_column
    why_rejected: Monospace trong thư viện này nghĩa là GIÁ TRỊ. Một cụm tiếng Việt
      lặp năm lần trong mono là typography mặc áo nhãn. Đã tái phạm ngay sau khi
      ghi nó ra làm lý do loại p4-limits — chỉ một luật kiểm được mới ngăn được,
      ghi lại thì không.
  - device: removing_a_number_the_package_explicitly_asks_for
    why_rejected: Bỏ dấu % ở s14-signal vì sợ bị đọc thành điểm an toàn. Nhưng lời
      thoại nói thẳng "rồi đếm xem bao nhiêu phần trăm route đã có test đó", và
      chính s14-limits tồn tại để nói con số ấy chứng minh và không chứng minh
      gì. Đó là Visual Engine quyết thay Content Engine ở đúng chỗ Content
      Engine đã lo.
  - device: a_camera_move_added_because_every_shot_is_static
    why_rejected: Đa dạng phải đến từ nghĩa. Camera tĩnh 17/17 vẫn đúng vì chưa shot
      nào có lý do di chuyển; khác biệt không gian nằm ở bố cục và chuyển động
      nội bộ.
  - device: mechanically_alternating_left_center_right_to_balance_the_metrics
    why_rejected: "Số đo là chẩn đoán, không phải chỉ tiêu. Khung nặng dưới chỉ được
      nặng dưới khi phần trống phía trên có nghĩa: câu hỏi không đứng dưới tiêu
      đề; con số đi từ shot trước sang nên nằm thấp; người sống sót chiếm chỗ ba
      giả thuyết vừa bỏ lại."
