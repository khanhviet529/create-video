spatial_model: "one table interior whose occupancy changes constantly and whose
  allocated boundary is a high-water mark: it moves outward when the interior
  runs out of room and never moves back, so bloat is the DISTANCE between what
  is occupied and what is allocated"
rejected_devices:
  - device: idle_cleaner_parked_as_a_filled_band_over_live_cells
    why_rejected: "CH3 beat 1 cần cỗ máy dọn CÓ MẶT mà KHÔNG chạy, và bản đầu để nó
      đỗ thành một dải phủ hai hàng đầu ở opacity .22. --authoritative là màu
      của cỗ máy dọn, nên phủ nó lên 22 ô SỐNG trong 15s là nói một điều không
      đúng về những ô đó; tệ hơn, ở beat 2 vài phiên bản chết đi ra khỏi ô của
      chúng từ dưới lớp phủ. Dời dải lên trên thế giới thì nó nằm sau dải thanh
      ghi và gate bắt được contrast #cDead tụt còn 2.67:1 (WCAG AA cần 3:1). Máy
      đang đỗ không phải một VÙNG mà là một VỊ TRÍ: nó đỗ thành một đường 4px
      trên mép cấp phát, không chạm ô nào, rồi DÀY LÊN thành dải khi autovacuum
      tới lượt. Cú dày lên đó chính là beat."
  - device: a_thumbnail_of_the_world_placed_beside_a_claim_it_does_not_witness
    why_rejected: 'CH10 bản đầu là bốn câu chữ xếp dọc cạnh một hình thu nhỏ bất
      động của bảng đã gói chặt sau VACUUM FULL — 0 dòng chết và cũng không
      bloat — đặt ngay cạnh câu "dòng chết bằng 0 không chứng minh hết bloat",
      tức trạng thái duy nhất mà câu ấy KHÔNG nói về. Comment trong code còn
      khẳng định extent của nó vẫn là mốc nước cao nhất, điều đã sai sau khi CH9
      viết lại bảng. Một hình đúng về mặt kỹ thuật vẫn có thể là nhân chứng sai.
      Lời thoại tự chỉ ra hai thiết bị đã có: "mốc nước vẫn nằm nguyên đó" =
      khung cấp phát, "bloat là chênh lệch, không phải kích thước" = thước.'
  - device: camera_push_in_across_an_abstraction_change_that_already_has_a_carrier
    why_rejected: "Cú vào gần CH1 → CH2 từng được ghi là earned. Đo trên artifact
      thì beat 0 của CH2 đã kín chuyển động (YMAX 94-198 liên tục từ 0.25s tới
      5.0s, lắng đúng lúc beat 1 mở) vì lượt hé lộ dân số theo thứ tự đọc CHÍNH
      LÀ cú đổi mức trừu tượng. Camera đặt lên đó là chuyển động thứ hai nói lại
      cùng một điều. Và nó không có chủ thể: trong CH1 không có vật nào trở
      thành thế giới CH2 — thanh dung lượng là phép ĐO cái bảng, không phải ruột
      bảng."
  - device: camera_pull_back_to_reveal_the_allocation_boundary
    why_rejected: 'P3 đo hai bản cùng thước cùng thời điểm: bản lùi ra thu ô xuống
      62% và không thêm một thông tin nào. Tệ hơn, thu nhỏ triệt tiêu một phần
      chính tín hiệu "lớn lên" mà chương đang phải cho thấy.'
  - device: packing_a_chapters_operations_into_its_first_beat
    why_rejected: CH6 dồn cả tám lần ghi vào beat 1, nên beat 2 — "ổn định thì ngừng
      lớn, nó chỉ không nhỏ lại" — chạy 3.46s trên một khung đã dừng hẳn. Cái đó
      đọc ra thành "không có gì đang xảy ra", mà đó không phải khẳng định. Khi
      một cảnh nói "cái này không nhúc nhích" thì phải có thứ khác đang nhúc
      nhích để sự đứng im có nghĩa.
  - device: two_counter_sequences_in_one_slot
    why_rejected: 'counter() chỉ ẩn giá trị trước CỦA CHÍNH NÓ, nên hai lời gọi cùng
      toạ độ cho hai dãy cùng hiện: n_dead_tup render ra "02" (0 đè lên 22),
      last_autovacuum ra "vừalxong". Ghi lại không ngăn được lần sau, nên
      counter() giờ ném lỗi build khi một ô đã có dãy, và nhận màu theo từng giá
      trị để một dãy đổi màu được giữa các giá trị.'
known_limitations:
  - limitation: Ranh giới ch01 → ch02 đo ra 1.75 và đạt chỉ nhờ trên ngưỡng 1.2. Đó
      là cú cắt giữa hai khung gần như trống (mực 2.65 và 1.00), nên phép trung
      bình toàn khung không có gì để bám. Ở ranh giới đó con số nên đọc là "dụng
      cụ không phân biệt được", không phải "đạt".
  - limitation: Ba lần đổi biểu diễn của G01 (CH3 vật lý↔giải tích, CH5 thước, CH10
      dụng cụ đo) đều xảy ra bằng cách THÊM MỘT LỚP cạnh thế giới, không phải
      bằng cách thế giới tự biến thành biểu diễn khác. Không có morph nào giữ
      thân phận xuyên qua một phép biến đổi hình học thật. Thế giới bền, nhưng
      nó bền theo kiểu tích luỹ trạng thái.
  - limitation: Tỉ lệ không đi đâu cả. Ô luôn 76px suốt mười chương; CH10 dùng 60px
      nhưng đó là một chương khác chứ không phải một hành trình tỉ lệ. Không có
      chặng vật → cơ chế cục bộ → cấu trúc hệ → hệ quả tổng → về lại vật. Thế
      giới bền ở đúng một khoảng cách nhìn.
  - limitation: Chỗ trống BÊN TRONG khung cấp phát có nghĩa rất rõ (chỗ dùng lại
      được, chưa bị chiếm). Chỗ trống NGOÀI khung — nửa dưới màn hình ở CH2,
      CH3, CH6 — phần lớn chỉ là chỗ trống.
  - limitation: 'CH1 (10s) và CH11 (6.5s) là chữ cộng một thanh lớn dần: 16.5s /
      175.5s nghiêng về "thông tin được làm cho động" hơn là "khái niệm thành
      chuyển động". Cố ý đối xứng — mở bằng một khẳng định, đóng bằng một câu
      hỏi — nhưng vẫn là chỗ yếu nhất của phim theo tiêu chí đó.'
  - limitation: Dải quét vàng xuất hiện ở năm chương (CH3, CH4, CH7, CH8, CH10). Ở
      G01 nó là NGỮ PHÁP, không phải thói quen, vì mỗi lần chỉ khác kết quả — đỗ
      im · dọn được · dọn dồn dập · chạy mà không thu được gì · số về 0 mà biên
      không đi. Nhưng đây đúng là loại thiết bị dễ trở thành ngữ pháp mặc định
      của video sau. KHÔNG dùng lại trừ khi chủ đề thật sự có một tiến trình
      quét qua một không gian và mỗi lần quét cho một kết quả khác.
