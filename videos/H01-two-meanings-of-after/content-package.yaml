narration:
  language: vi
  syllable_count: 711
  assumed_syllables_per_second: 4.2
  estimated_duration_sec: 169
  beat_count: 39
  text: |
    Bạn thêm một read replica. Đúng sách, đúng lúc.

    Đọc nhanh hơn. Primary nhẹ hẳn đi. Mọi thứ chạy tốt.

    Rồi support bắt đầu nhận báo lỗi. User bấm lưu, hệ thống báo đã lưu, bấm F5 thì giá trị cũ quay lại.

    Họ gọi đó là mất dữ liệu.

    Nhưng không có gì mất. Giá trị mới nằm nguyên trên primary.

    Kiểm cache: đường đó không có cache. Kiểm log ghi: câu UPDATE chạy, commit thành công, đúng giá trị mới.

    Không node nào hỏng. Cả hai đang trả lời đúng câu hỏi được đặt cho chúng.

    Postgres ghi mọi thay đổi vào một cái log, và replica chạy lại đúng cái log đó.

    Primary commit xong ở vị trí năm trăm trong log.

    Replica lúc đó đang ở bốn trăm chín mươi chín.

    Câu đọc của user chạy trên replica. Nó thấy đúng thế giới ở vị trí bốn trăm chín mươi chín.

    Doc Postgres nói streaming replication mặc định là bất đồng bộ. Có một khoảng trễ nhỏ giữa lúc commit trên primary và lúc thay đổi hiện ra trên replica.

    Doc còn cho một con số. Thường là dưới một giây.

    Dưới một giây nghe rất lành, và trên dashboard nào nó cũng là con số đẹp. Nhưng khoảng cách giữa lúc user bấm lưu và lúc trình duyệt gửi câu đọc tiếp theo cũng là dưới một giây.

    Hai khoảng đó chồng lên nhau. Đó là toàn bộ lỗi.

    Chỗ này chữ "sau" đang gánh một việc nó không gánh nổi.

    Câu đọc xảy ra sau câu ghi, nếu đo bằng đồng hồ.

    Nó xảy ra trước câu ghi, nếu đo bằng vị trí trong log.

    Với một node, hai cách đo đó là một. Với hai node thì không.

    Thứ vừa mất có tên. Read-your-writes: ghi thành công rồi đọc lại thì phải thấy được cái mình vừa ghi.

    Và nói cho rõ, eventual consistency vẫn đang được giữ đúng. Đây là hai bảo đảm khác nhau. Mất cái này không bắt buộc phải mất cái kia.

    Giờ tới phần đáng nói nhất. Bạn không gặp bug. Bạn đã trả một cái giá.

    Thêm replica mua thêm khả năng đọc. Thứ đem đi đổi là read-your-writes.

    Cái giá đó không nằm trong câu lệnh tạo replica, nên lúc trả không ai nhìn thấy.

    Có bốn chỗ để đứng. Chỗ nào cũng phải trả một thứ.

    Chỗ thứ nhất, rẻ nhất. Câu đọc nào cần thấy cái vừa ghi thì cho về primary.

    Nhưng bạn phải biết câu nào cần. Tri thức đó nằm trong đầu người viết code, không nằm trong hệ thống.

    Chỗ thứ hai. Ghi xong thì nhớ vị trí log, đọc thì chờ replica tới vị trí đó.

    Đúng ngữ nghĩa nhất, vì nó biến chữ "sau" thành một thứ so sánh được. Đắt về code, và câu đọc có thể phải chờ.

    Chỗ thứ ba. Bắt primary chờ replica. Postgres có mức remote apply. Commit không trả về cho tới khi replica đã áp dụng xong. Tức là tới khi câu đọc trên replica thấy được nó.

    Doc nói thẳng: mức đó làm độ trễ commit tăng lên nhiều hơn hẳn, vì nó phải chờ replay. Và replica chết thì đường ghi đứng theo.

    Chỗ thứ tư, hay bị chọn nhất. Sau khi lưu thì hiện luôn giá trị vừa gửi, không đọc lại.

    Cái này không sửa gì trong hệ thống. Nó sửa cái người dùng thấy. Tab thứ hai vẫn thấy giá trị cũ.

    Đo thì đừng đo replication lag như một con số.

    Postgres cho ba con số khác nhau. Write lag, flush lag, và replay lag.

    Chỉ replay lag mới nói về cái mà câu đọc trên replica thấy được. Hai con số kia nói về độ bền.

    Và replay lag thấp không chứng minh bạn an toàn. Cửa sổ chỉ cần dài bằng một vòng round trip của trình duyệt.

    Còn primary đang rảnh thì cả ba con số đều về gần không. Không phải vì mọi thứ ổn, mà vì không có gì để chép.

    Cái gì trong hệ thống của bạn đang quyết định một câu SELECT đi về primary hay replica? Và nó có biết gì về câu ghi vừa xảy ra không?
  inseparable:
    - beats: [13, 14]
      reason: >-
        Beat 13 đưa con số có nguồn: độ trễ thường dưới một giây. Beat 14 đặt nó cạnh khoảng
        thời gian giữa lúc bấm lưu và lúc trình duyệt gửi câu đọc tiếp theo, và cho thấy hai
        khoảng đó chồng lên nhau. Đứng một mình, beat 13 dạy NGƯỢC lại điều nó định dạy -
        dưới một giây nghe như hoàn toàn an toàn.
    - beats: [30, 31]
      reason: >-
        Beat 30 nêu remote apply là mức làm commit chờ tới khi replica thấy được. Beat 31 nêu
        giá: độ trễ commit tăng nhiều hơn hẳn, và replica chết thì đường ghi đứng theo. Bỏ
        beat 31 là biến một tham số có hậu quả nặng ở tầng ghi thành một công tắc vô hại.
    - beats: [32, 33]
      reason: >-
        Beat 32 nêu cách rẻ nhất và hay bị chọn nhất: hiện luôn giá trị vừa gửi. Beat 33 nêu
        giới hạn: nó không sửa gì trong hệ thống, tab thứ hai vẫn thấy giá trị cũ. Bỏ beat 33
        là trình bày một cách sửa giao diện như một cách sửa dữ liệu.

technical_notes:
  - >-
    Cách nói "replica chậm hơn primary" bị loại có chủ ý khỏi toàn bộ package, kể cả research.
    Nó dựng lại theo nghĩa đen thành một vấn đề HIỆU NĂNG - nâng cấu hình là hết - trong khi
    đây là vấn đề VỊ TRÍ. Replica nhanh gấp mười lần vẫn có một khoảng trễ khác không, và cửa
    sổ chỉ cần dài bằng một round trip.
  - >-
    Bẫy tên gọi đã cắt khỏi narration: synchronous_commit mặc định là on, nhưng replication
    chỉ đồng bộ khi synchronous_standby_names được đặt khác rỗng. Nghĩa là thấy on KHÔNG có
    nghĩa là đang chạy replication đồng bộ. Narration nhắc remote apply mà cố ý không nhắc
    synchronous_commit = on, vì remote apply là một giá trị cụ thể và không mơ hồ.
  - >-
    Chữ "mất dữ liệu" xuất hiện trong narration nhưng được gán cho NGƯỜI BÁO LỖI ở một beat
    rồi bác ngay ở beat sau. Đây là cách dùng có kiểm soát một từ vựng sai mà vẫn phải nhắc,
    không phải nhầm lẫn của package.
  - >-
    Cơ chế là chung cho mọi replication bất đồng bộ. Các con số, tên tham số và tên cột là của
    PostgreSQL. Logical replication cùng hình dạng vấn đề nhưng chưa verify nên không phát
    biểu gì.
  - >-
    Vị trí log 500 và 499 là số ví dụ cho khoảng cách một nhịp, không phải phép đo LSN thật.
    Con số duy nhất có nguồn trong narration là "thường dưới một giây".
  - >-
    Ranh giới giữa read-your-writes và session consistency khác nhau tuỳ tài liệu. Package
    dùng read-your-writes theo nghĩa hẹp - đọc lại sau khi ghi thì thấy được cái mình vừa ghi -
    và không phát biểu gì về session consistency. Ghi lại thay vì tự hoà giải.

rejected_explanations:
  - explanation: "Mất dữ liệu"
    reason: >-
      Không mất. Giá trị mới nằm nguyên trên primary và sẽ hiện ra trên replica sau vài trăm
      mili giây. Đây là từ vựng của người báo lỗi, và tin theo nó đẩy chẩn đoán sang tầng ghi
      ngay từ đầu - tức đi sai hướng trước khi kịp nhìn vào tầng đọc. Cách nói đúng: dữ liệu
      CŨ, không phải dữ liệu MẤT.
  - explanation: "Replica chậm, nâng cấu hình là hết"
    reason: >-
      Đây không phải vấn đề hiệu năng. Nâng cấu hình THU HẸP cửa sổ chứ không ĐÓNG nó, và cửa
      sổ chỉ cần dài bằng một round trip của trình duyệt. Dựng lại theo nghĩa đen thì fix
      thành "mua máy to hơn", vốn không sửa gì và còn tốn tiền.
  - explanation: "Eventual consistency thì phải chịu thôi"
    reason: >-
      Gộp ba bảo đảm khác nhau thành một. Eventual consistency vẫn đang được giữ đúng - replica
      SẼ bắt kịp. Cái mất là read-your-writes, và nó mua lại được bằng bốn cách khác nhau mà
      không phải bỏ eventual consistency. Cách nói này biến một lựa chọn thành một định mệnh.
  - explanation: "synchronous_commit đang là on nên replication đã đồng bộ rồi"
    reason: >-
      on là giá trị MẶC ĐỊNH, và nó chỉ có hiệu lực với standby đồng bộ. Không đặt
      synchronous_standby_names thì không có standby đồng bộ nào để chờ. Đây là bẫy tên gọi
      thật trong sản phẩm, không phải hiểu lầm do người dùng nghĩ ra - nên nó nguy hiểm hơn
      ba cái trên.

sources:
  - title: "PostgreSQL - Log-Shipping Standby Servers"
    url: "https://www.postgresql.org/docs/current/warm-standby.html"
    supports: >-
      Streaming replication mặc định bất đồng bộ, có khoảng trễ nhỏ giữa lúc commit trên
      primary và lúc thay đổi hiện ra trên standby, thường dưới một giây. Replication đồng bộ
      đòi synchronous_standby_names khác rỗng.
    kind: primary
  - title: "PostgreSQL - Write Ahead Log configuration"
    url: "https://www.postgresql.org/docs/current/runtime-config-wal.html"
    supports: >-
      Năm mức synchronous_commit với on là mặc định. remote_apply chờ tới khi standby đã áp
      dụng và thay đổi đã hiện ra với query trên standby, và mức đó làm độ trễ commit tăng
      nhiều hơn hẳn vì phải chờ WAL replay.
    kind: primary
  - title: "PostgreSQL - Monitoring Statistics"
    url: "https://www.postgresql.org/docs/current/monitoring-stats.html"
    supports: >-
      pg_stat_replication với bốn cột LSN và ba cột lag. replay_lag là thời gian tới khi
      standby đã written, flushed and applied - khác với write_lag và flush_lag.
    kind: primary

confidence: high

open_questions:
  - >-
    Chưa verify logical replication: cùng hình dạng vấn đề nhưng tham số và hành vi khác.
    Nếu làm video tiếp về chủ đề này thì phải đọc doc riêng.
  - >-
    Chưa khảo sát tầng route của các framework phổ biến ở Việt Nam - Laravel read/write
    connection, Rails role-based connection switching, Spring AbstractRoutingDataSource - cái
    nào có sẵn cơ chế "ghi xong thì đọc từ primary trong một khoảng" và cái nào phải tự làm.
    Đây là thứ quyết định vị trí thứ nhất rẻ tới mức nào trong thực tế.
  - >-
    Chưa có cơ sở để nói tỉ lệ request nào rơi vào cửa sổ trong một hệ thống thật. Video cố ý
    chỉ nói cửa sổ rộng bao nhiêu và cách đo, không nêu tỉ lệ nào.

