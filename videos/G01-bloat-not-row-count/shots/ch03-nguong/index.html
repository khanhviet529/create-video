<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* @brand:start */
:root {
  --ground: #0C0D0F; --ground-lift: #14161A;
  --ink: #EDEAE4; --ink-mid: #9AA0A6; --ink-dim: #8B9198; --ink-ghost: #3A3E42;
  --rule: #23272A; --rule-bright: #3D4348; --hair: 1.5px;
  --authoritative: #C9A227; --stale: #E0533D; --lost: #6A6F74;
  --boundary: #4E8C7D; --pressure: #B4623A; --counterfactual: #7A8086;
  --font-value: "IBM Plex Mono", ui-monospace, monospace;
  --font-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --t-hero: 200px; --t-value: 64px; --t-body: 36px; --t-label: 26px; --track-label: 0.18em;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-label); }
.label { font-family: var(--font-label); font-size: var(--t-label); letter-spacing: var(--track-label);
         text-transform: uppercase; color: var(--ink-dim); font-weight: 500; }
/* @brand:end */

html, body { width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; }

.cell { position: absolute; border-radius: 1px; }
.live { background: var(--ink); }
.dead { background: var(--lost); }
.free { background: transparent; box-shadow: inset 0 0 0 4px var(--rule-bright); } /* Ô TRỐNG */
/* a slot whose DEPICTION has been lifted out to be counted. The slot is still occupied —
   nothing in the relation moved, and the ghost is what says so. */
.ghost { background: transparent; box-shadow: inset 0 0 0 3px var(--lost); }

.frame { position: absolute; left: 0; top: 0; }
.fbar { position: absolute; background: var(--ink-dim); }   /* KHUNG CẤP PHÁT */
.fbar.h { height: 3px; }
.fbar.v { width: 3px; transform-origin: left top; }
#need .fbar { background: var(--boundary); }

.cap { position: absolute; font-family: var(--font-label); font-size: 26px;
       letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }
.val { position: absolute; font-family: var(--font-value); font-size: 54px; }

/* the analytical register — a different band of the frame, with its own rule */
#analytic { position: absolute; left: 90px; top: 1362px; width: 900px; height: 1.5px;
            background: var(--counterfactual); opacity: .5; }
/* a sweep event travelling down the allocation */
.sweep { position: absolute; background: var(--authoritative); opacity: .22; }
/* the visibility horizon held by an old snapshot */
.horizon { position: absolute; left: 76px; width: 928px;
           height: 3px;
           background: repeating-linear-gradient(90deg, var(--boundary) 0 16px, transparent 16px 28px); }

/* the measurement register: bars on an axis. A quantity belongs on an axis, never as a
   frame drawn around a subset of cells — that reads as a physical partition, which is false. */
#axis { position: absolute; left: 90px; top: 300px; width: 900px; height: 1.5px; background: var(--rule); }
.bar { position: absolute; left: 90px; height: 22px; transform-origin: left center; }
#bNeed { top: 246px; background: var(--boundary); }
#bAlloc { top: 316px; background: var(--stale); }
#drop { position: absolute; top: 246px; width: 1.5px; height: 112px; background: var(--boundary); opacity: .55; }

/* ---------------------------------------------------------------------------
   CH3 — the threshold. The dead versions are counted in a separate register and then
   returned to the exact slots they came from. A ghost holds each slot while its
   depiction is away, so the world never claims a tuple moved.
--------------------------------------------------------------------------- */
#cLive { left: 90px; top: 250px; color: var(--ink); }
#cDead { left: 520px; top: 250px; color: var(--lost); }
#thr { position: absolute; left: 90px; top: 1400px; color: var(--counterfactual);
       font-family: var(--font-label); font-size: 26px; letter-spacing: .14em;
       text-transform: uppercase; font-weight: 500; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15"
     data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="15" data-track-index="0">
    <div id="alloc" class="frame"></div>
    <div id="need" class="frame"></div>
    <div id="world"></div>
    <div id="cLive" class="cap">phiên bản sống</div>
    <div id="cDead" class="cap">phiên bản chết</div>
    <div id="analytic"></div>
    <div id="thr">ngưỡng &middot; 20% số dòng của bảng</div>
  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = 'power3.out', T = 'power2.inOut';

const COLS = 11, CELL = 76, GAP = 10, PITCH = CELL + GAP;
const X0 = 90, Y0 = 430;
const LIVE_N = 88;
const slotXY = (i) => [X0 + (i % COLS) * PITCH, Y0 + Math.floor(i / COLS) * PITCH];

const stage = document.getElementById('stage');
const world = document.getElementById('world');
const cells = [];

function makeCell(i, state) {
  const [x, y] = slotXY(i);
  const d = document.createElement('div');
  d.className = 'cell ' + state;
  d.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + CELL + 'px;height:' + CELL + 'px';
  world.appendChild(d);
  cells[i] = { el: d, state };
  return d;
}
function setState(i, state) {
  const c = cells[i];
  if (!c) return;
  c.el.className = 'cell ' + state;
  c.state = state;
}
const rowsFor = (n) => Math.ceil(n / COLS);
function frameFor(n) {
  return { x: X0 - 14, y: Y0 - 14, w: COLS * PITCH - GAP + 28, h: rowsFor(n) * PITCH - GAP + 28 };
}
function applyFrame(el, n) {
  const f = frameFor(n);
  el.innerHTML = '';
  const mk = (cls, css) => {
    const d = document.createElement('div');
    d.className = 'fbar ' + cls; d.style.cssText = css; el.appendChild(d); return d;
  };
  const top = mk('h', 'left:' + f.x + 'px;top:' + f.y + 'px;width:' + f.w + 'px');
  const bot = mk('h', 'left:' + f.x + 'px;top:' + f.y + 'px;width:' + f.w + 'px');
  const lft = mk('v', 'left:' + f.x + 'px;top:' + f.y + 'px;height:1px');
  const rgt = mk('v', 'left:' + (f.x + f.w - 3) + 'px;top:' + f.y + 'px;height:1px');
  gsap.set(bot, { y: f.h - 3 });
  gsap.set([lft, rgt], { scaleY: f.h });
  el._bars = { top, bot, lft, rgt };
}
function growFrame(tl, el, n, at, duration) {
  const f = frameFor(n), b = el._bars;
  if (!b) return;
  tl.to(b.bot, { y: f.h - 3, duration: duration || 0.45, ease: T }, at);
  tl.to([b.lft, b.rgt], { scaleY: f.h, duration: duration || 0.45, ease: T }, at);
}
/** one element per value, exactly one visible at a time — textContent is never mutated */
const COUNTER_SLOTS = new Set();
function counter(left, top, color, values, times) {
  // Two sequences in one slot stack: each call only hides its own values. One slot, one call.
  const slot = left + ',' + top;
  if (COUNTER_SLOTS.has(slot)) {
    throw new Error('counter(): ô ' + slot + ' đã có một dãy. Gộp mọi giá trị của cùng một'
      + ' ô vào MỘT lời gọi — hai lời gọi cùng ô sẽ hiện đè lên nhau.');
  }
  COUNTER_SLOTS.add(slot);
  values.forEach((v, k) => {
    const d = document.createElement('div');
    d.className = 'val';
    d.setAttribute('data-layout-allow-overlap', '');
    const col = Array.isArray(color) ? color[k] : color;
    d.style.cssText = 'left:' + left + 'px;top:' + top + 'px;color:' + col + ';opacity:0';
    d.textContent = String(v);
    stage.appendChild(d);
    tl.set(d, { opacity: 1 }, times[k]);
    // hide a frame BEFORE the next value shows: two gsap.set calls at an identical time
    // resolved inconsistently under frame-by-frame seeking and left both digits on screen.
    if (k < values.length - 1) tl.set(d, { opacity: 0 }, times[k + 1] - 0.02);
  });
}

const INIT = ["live","live","live","dead","live","live","live","live","dead","live","live","live","live","dead","live","live","live","dead","live","live","live","live","dead","live","live","live","dead","live","live","live","live","dead","live","live","live","live","dead","live","live","live","dead","live","live","live","live","dead","live","live","live","live","dead","live","live","live","dead","live","live","live","live","dead","live","live","live","live","live","live","live","live","dead","live","live","live","live","dead","live","live","live","dead","live","live","live","live","dead","live","live","live","live","dead","live","live","live","live","live","live","live","live","live","live","live","live","live","live","live","live","live","live"];
const START_ALLOC = 110;
let nextFree = 106, allocated = START_ALLOC;
/* the live array comes from the simulation, order and all */
let live = [0,1,2,102,4,5,6,7,95,9,10,11,12,88,14,15,16,100,18,19,20,21,93,23,24,25,105,27,28,29,30,98,32,33,34,35,91,37,38,39,103,41,42,43,44,96,46,47,48,49,89,51,52,53,101,55,56,57,58,94,60,61,62,63,64,65,66,67,99,69,70,71,72,92,74,75,76,104,78,79,80,81,97,83,84,85,86,90];
INIT.forEach((s, i) => makeCell(i, s));
const alloc = document.getElementById('alloc');
applyFrame(alloc, allocated);
document.getElementById('need').remove();
/* the same deterministic pick the whole video uses — chapter boundaries never reset it */
let u = 18;
function pickLive() { const p = live[(u * 37 + 13) % live.length]; u += 1; return p; }
/* A BUILD-TIME shadow of the world. cells[] only changes when the timeline PLAYS, so a
   firstFree() that read it while scheduling returned the same slot for every update in
   the loop — eight updates all aimed at one cell, and the chapter ended in a state the
   next chapter had never inherited. */
const st = INIT.slice();
function firstFree() {
  for (let i = 0; i < nextFree; i++) if (st[i] === 'free') return i;
  return nextFree++;
}
const sweepBar = document.createElement('div');
sweepBar.className = 'sweep';
sweepBar.style.cssText = 'left:' + (X0 - 14) + 'px;top:' + (Y0 - 14) + 'px;width:' +
  (COLS * PITCH - GAP + 28) + 'px;height:' + (PITCH * 2) + 'px';
stage.appendChild(sweepBar);
gsap.set(sweepBar, { opacity: 0 });
function sweep(at, span, reclaim) {
  const rows = Math.ceil(nextFree / COLS);
  tl.set(sweepBar, { y: 0 }, at);
  tl.to(sweepBar, { opacity: 1, duration: .18 }, at);
  tl.to(sweepBar, { y: rows * PITCH - PITCH, duration: span, ease: 'none' }, at + 0.18);
  tl.to(sweepBar, { opacity: 0, duration: .22 }, at + 0.18 + span);
  if (!reclaim) return;
  for (let i = 0; i < nextFree; i++) if (st[i] === 'dead') st[i] = 'free';
  for (let i = 0; i < nextFree; i++) {
    const row = Math.floor(i / COLS);
    tl.call(((idx) => () => { if (cells[idx] && cells[idx].state === 'dead') setState(idx, 'free'); })(i),
      null, at + 0.3 + (row / rows) * span);
  }
}
gsap.set(['#analytic','#thr'], { opacity: 0 });

/* beat 1 — autovacuum exists and is NOT running. The band appears at the top of the
   allocation and stays there: a cleaner poised, which is what "không chạy liên tục" is. */
tl.set(sweepBar, { y: 0, scaleY: 4 / (PITCH * 2), transformOrigin: 'left top' }, 0);
tl.to(sweepBar, { opacity: .9, duration: .5, ease: R }, 0.9);
counter(90, 286, '#EDEAE4', [88], [0]);
counter(520, 286, '#6A6F74', [18], [0]);

/* beat 2 — the analytical band opens, in its own region of the frame */
tl.to(['#analytic','#thr'], { opacity: 1, duration: .5, ease: R }, 3.7199999999999998);

/* one travelling copy per dead version; the slot keeps a ghost the whole time */
const DEAD = [3,8,13,17,22,26,31,36,40,45,50,54,59,68,73,77,82,87];
const trips = [];
DEAD.forEach((idx, k) => {
  const [sx, sy] = slotXY(idx);
  const d = document.createElement('div');
  d.className = 'cell dead';
  d.style.cssText = 'left:' + sx + 'px;top:' + sy + 'px;width:' + CELL + 'px;height:' + CELL + 'px';
  world.appendChild(d);
  const tx = 90 + (k % 9) * (CELL + 14), ty = 1466 + Math.floor(k / 9) * (CELL + 14);
  trips.push({ el: d, idx: idx });
  const out = 4.12 + k * 0.09;
  tl.call(((i) => () => setState(i, 'ghost'))(idx), null, out);
  tl.to(d, { x: tx - sx, y: ty - sy, duration: .8, ease: T }, out);
});

/* beat 3 — the count against the threshold, then everything returns */
trips.forEach((tr, k) => {
  const back = 10.77 + k * 0.06;
  tl.to(tr.el, { x: 0, y: 0, duration: .8, ease: T }, back);
  tl.call(((i) => () => setState(i, 'dead'))(tr.idx), null, back + 0.75);
  tl.to(tr.el, { opacity: 0, duration: .1 }, back + 0.8);
});
tl.to(['#analytic','#thr'], { opacity: 0, duration: .5, ease: 'power2.in' }, 12.67);
window.__timelines['main'] = tl;
</script>
</body>
</html>
