      op: vào gần
      why_rejected: >-
        đổi mức trừu tượng là thật, nhưng nó đã có người mang: CH2 hé lộ dân số theo thứ tự
        đọc suốt trọn beat 0. Đo trên artifact, beat đó kín chuyển động (YMAX 94-198 liên tục
        từ 0.25s tới 5.0s, lắng đúng lúc beat 1 mở). Một cú vào gần đặt lên đó là chuyển động
        thứ hai nói lại cùng một điều — và nó không có chủ thể: trong CH1 không có vật nào
        trở thành thế giới CH2, thanh dung lượng là phép ĐO cái bảng chứ không phải ruột bảng.
        Camera lúc đó chỉ còn là trang trí.
    - at: CH4 -> CH5
      op: lùi ra
      why_rejected: "P3 đo: cùng thước, cùng thời điểm, B thu ô xuống 62% và không
        thêm thông tin nào. Tệ hơn, thu nhỏ triệt tiêu một phần chính tín hiệu
        lớn lên"
typography_budget:
  rule: chữ NEO, không mang cơ chế. Không đoạn văn, không trang tài liệu, không
    panel code — cơ chế này sống trong chỗ lưu trữ chứ không trong code
  numbers_allowed:
    - at: CH2
      what: số phiên bản sống — MỘT con số duy nhất
      why: lời khẳng định "số dòng đứng yên" phải KIỂM ĐƯỢC; đếm 44 ô bằng mắt không
        phải là kiểm. Prototype hiện ba con số là để kiểm trong lúc R&D, không
        phải để dựng
