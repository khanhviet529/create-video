world:
  note: >-
    Một thế giới dùng chung cho mọi prototype, khai ở tools/gen-g01-proto.mjs. Ô
    là chỗ lưu trữ VẬT LÝ; màu là trạng thái và chỉ là trạng thái. Biên cấp phát
    là một vật hình học KHÁC với trạng thái ô — đó là thứ giữ cho "dùng lại bên
    trong" và "trả về OS" không bao giờ trông giống nhau.
  physical_rule: >-
    UPDATE không sửa ô tại chỗ. Nó làm ô cũ chết TẠI CHỖ và ghi phiên bản sống
    mới ở ô trống đầu tiên — một chỗ KHÁC. Biên chỉ nở khi bên trong hết chỗ.
  anchor: >-
    Neo là một ĐẠI LƯỢNG chứ không phải một vị trí: vùng "chỗ dữ liệu sống cần"
    giữ nguyên diện tích vì SỐ phiên bản sống là hằng số, dù mọi phiên bản bên
    trong đều đã bị ghi lại ở chỗ khác. Bloat là khoảng cách giữa vùng đó và
    biên cấp phát.
  contract: "Xem CHAPTER_ARCHITECTURE.md §1. Cố định cho cả video: ô đặc ink =
    phiên bản sống · ô đặc lost = phiên bản chết nằm đúng chỗ nó chết · ô viền
    rule-bright = trống, dùng lại được BÊN TRONG · khung ngoài rule-bright =
    phần ĐÃ CẤP, chỉ nở ra · vạch teal = chỗ dữ liệu sống cần, KHÔNG BAO GIỜ đổi
    độ dài · vạch vermilion = chỗ đã cấp · chân trời nét đứt = đường khả kiến
    của transaction mở · ochre = sự kiện sweep. Không màu nào, không hình học
    nào được đổi nghĩa về sau vì một cảnh khác cần nó."
  measurement_is_not_a_region: 'Bản Step 3 vẽ "chỗ dữ liệu sống cần" thành khung
    bao quanh mấy hàng ô đầu. Đo lại chính nội dung nó bao thì nó ôm cả ô trống
    và bỏ sót ô sống nằm dưới — nó đọc thành phân vùng vật lý của relation, và
    điều đó SAI: phiên bản sống nằm rải khắp phần đã cấp. Phép đo nay sống trên
    MỘT TRỤC ở register đỉnh; thế giới chỉ còn MỘT khung, là phần đã cấp. Vạch
    trên trục và ô trong khung là hai loại hình học khác nhau nên hai mức không
    thể lẫn. Chứng minh ở p5-measure-register.'
  vacuum_changes: ô lost -> ô viền · số phiên bản chết về ~0
  vacuum_does_not_change: "khung ngoài · vạch vermilion · số phiên bản sống · vạch
    teal. Ràng buộc dựng: trong chương VACUUM không được có MỘT tween nào chạm
    khung ngoài hay vạch vermilion — kiểm bằng đọc timeline, không bằng nhìn."

