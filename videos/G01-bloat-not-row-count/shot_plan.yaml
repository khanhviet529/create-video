  - id: CH2-29s
    what: CH2 mang 27.65s lời trong khung 29s
    why: P5 mới chứng minh thế giới sống được 26s. 29s là dài hơn 3 giây so với thứ
      đã đo. Xem lại khi dựng, và nếu nhàm thì thêm một trạng thái trung gian
      chứ KHÔNG cắt chương
  - id: CH10-22s
    what: CH10 là 22s ở mức thiết bị, chương dài thứ hai
    why: đây là chương DUY NHẤT rời thế giới bền. 22s ở một register chưa prototype
      là rủi ro chưa đo
  - id: CH1-camera
    what: cú vào gần CH1→CH2 vẫn chưa tự chứng minh
    why: P3 đã loại cú lùi bằng đo; cú vào gần phải chịu cùng một phép thử
production_notes:
  continuity_is_constructed: "Thế giới liên tục không phải lời hứa mà là cấu trúc:
    mô phỏng chạy ở Node, và mỗi chương được sinh ra với ĐÚNG trạng thái đóng
    của chương trước. Một chương không thể trôi khỏi chương trước vì nó không
    bao giờ tự tính điểm xuất phát của mình."
  bug_animation_only_op: "Bản vá beat thêm một sweep tay ở CH7 beat 1 và năm cặp
    update+sweep ở beat 5 vào ANIMATION mà không thêm vào mô phỏng. Ba ranh giới
    khai LIÊN TỤC đo ra khác hẳn. Luật rút ra: mọi thao tác chương ANIMATE đều
    phải có trong mô phỏng, cùng thứ tự."
  bug_build_time_state: firstFree() đọc cells[] — thứ chỉ đổi lúc PHÁT — trong khi
    nó được gọi lúc DỰNG timeline. Tám update của CH6 đều nhắm vào cùng một ô,
    và chương kết thúc ở một trạng thái chương sau chưa từng thừa hưởng. Sửa
    bằng một bản trạng thái song song cập nhật đồng bộ lúc dựng.
  both_found_by_measurement: Cả hai lộ ra từ phép đo YAVG giữa khung cuối chương
    này và khung đầu chương kế, không từ việc đọc lại code. Xem một chương riêng
    lẻ thì cả hai đều trông đúng.
  bug_array_order: "Thứ tự mảng cũng là trạng thái. pickLive index vào `live`; mô phỏng giữ nó
    theo lịch sử thay-thế-tại-chỗ, còn chương dựng lại nó bằng cách quét INIT
    theo chỉ số. Cùng tập phần tử, khác thứ tự thì cùng một u cho ra ô khác. Khó
    thấy nhất trong ba bug: INIT đúng, u đúng, nextFree đúng, alloc đúng — chỉ
    THỨ TỰ sai, và thứ tự không xuất hiện ở bất kỳ giá trị nào người ta nghĩ tới
    khi kiểm trạng thái. Sửa: snap() mang theo live.slice()."
  continuity_is_measurable: So khung cuối chương này với khung đầu chương kế bằng YAVG. Ranh giới khai
    LIÊN TỤC phải thấp, dưới 1.2; khai CẮT phải cao. Đây là cách biến "thế giới
    có bền không" thành một câu đo được thay vì một câu cảm nhận.

status: FROZEN_BENCHMARK
fingerprint:
  status: FROZEN_BENCHMARK
  dominant_compositions:
    - one_storage_world_held_for_137_seconds_across_seven_chapters
