narration:
  language: vi
  syllable_count: 658
  assumed_syllables_per_second: 4.2
  estimated_duration_sec: 157
  beat_count: 38
  text: |
    Bảng đơn hàng của bạn có một triệu dòng. Sáu tháng trước cũng khoảng một triệu.

    Dung lượng thì tăng đều suốt sáu tháng đó.

    Số dòng đứng yên. Chỗ nó chiếm thì không.

    Tua lại sáu tháng vừa rồi. Mỗi đơn hàng bị UPDATE vài lần. Đổi trạng thái, gắn mã vận đơn, cập nhật thời gian giao.

    Và UPDATE trong Postgres không sửa dòng tại chỗ.

    Nó ghi một phiên bản mới của dòng đó, rồi đánh dấu phiên bản cũ là đã chết.

    Doc Postgres nói rõ vì sao. Phiên bản cũ không được xoá chừng nào nó còn có thể nhìn thấy được với một transaction khác.

    Đó không phải Postgres lười. Đó là điều kiện để một transaction đang chạy nhìn thấy dữ liệu nhất quán từ đầu tới cuối.

    Nên sau mỗi lần UPDATE, bảng có thêm một phiên bản chết nằm lại.

    Postgres có autovacuum để dọn chúng. Nhưng nó không chạy liên tục.

    Mặc định, autovacuum đợi tới khi số dòng chết đạt hai mươi phần trăm số dòng của bảng.

    Bảng một triệu dòng thì đó là khoảng hai trăm nghìn phiên bản chết. Bảng phải mang chừng ấy chỗ dư trước khi có ai đụng tới.

    Rồi autovacuum tới lượt, và chạy VACUUM trên bảng đó. Đây là chỗ trực giác lệch.

    VACUUM có dọn phiên bản chết thật. Số dòng chết về gần không.

    Nhưng nó không trả chỗ đó về cho hệ điều hành. Nó đánh dấu chỗ đó là dùng lại được, bên trong chính bảng.

    File không nhỏ đi một byte.

    Kích thước file không đo lượng dữ liệu đang sống trong bảng.

    Nó là mốc nước cao nhất. Là lượng dữ liệu đồng thời lớn nhất mà bảng từng phải chứa.

    Mốc nước thì chỉ đi lên.

    Chênh lệch giữa chỗ file chiếm và chỗ dữ liệu sống cần, cái đó gọi là bloat.

    Có một tin tốt ở đây. Chỗ trống bên trong được tái dùng cho lần ghi sau.

    Nên bảng ở trạng thái ổn định thì ngừng lớn. Nó chỉ không nhỏ lại.

    Cách sửa không phải chạy VACUUM tay cho thường xuyên hơn.

    Là hạ ngưỡng thu hồi cho riêng bảng nóng. Ví dụ đặt scale factor xuống hai phần trăm thay vì hai mươi.

    Số phiên bản chết sinh ra không giảm đi. File vẫn không bao giờ tự nhỏ lại. Query, lược đồ, code ứng dụng đều giữ nguyên.

    Cái được là mốc nước bị giữ thấp. Chỗ chết được tái dùng trước khi bảng phải xin thêm chỗ mới.

    Đổi lấy chuyện đó, autovacuum chạy thường hơn và tốn I O đều hơn. Với bảng gần như chỉ INSERT thì đó là công cốc.

    Còn một trường hợp riêng phải biết.

    Nếu có một transaction mở rất lâu, autovacuum vẫn chạy, vẫn báo xong, và vẫn không dọn được gì.

    Vì những phiên bản chết sinh ra sau khi nó bắt đầu thì với nó vẫn còn nhìn thấy được.

    Muốn file thật sự nhỏ lại thì phải viết lại cả bảng. VACUUM FULL làm được chuyện đó.

    Nhưng nó khoá bảng ở mức cao nhất suốt thời gian chạy. Và nó cần thêm đĩa, vì phải giữ cả bản cũ lẫn bản mới cho tới khi xong.

    Lúc đĩa gần đầy chính là lúc khó chạy nó nhất.

    Muốn biết mình đang ở đâu thì nhìn hai cột trong pg_stat_user_tables. Số dòng chết, và lần autovacuum gần nhất.

    Dòng chết cao kèm lần dọn gần nhất đã cũ, nghĩa là thu hồi không theo kịp, hoặc đang bị chặn.

    Nhưng dòng chết bằng không thì không chứng minh bảng không bloat. Nó chỉ nói vừa dọn xong. Mốc nước vẫn nằm nguyên đó.

    Và bảng lớn cũng không chứng minh bloat. Bloat là chênh lệch, không phải kích thước.

    Trong database của bạn, bảng nào có số dòng đứng yên mà dung lượng vẫn tăng?
  inseparable:
    - beats: [11, 12]
      reason: >-
        Beat 11 nêu ngưỡng hai mươi phần trăm. Beat 12 quy nó ra hai trăm nghìn phiên bản
        chết cho bảng cụ thể này. Riêng beat 11 là một dòng cấu hình không có nghĩa với người
        xem; riêng beat 12 thì con số hai trăm nghìn mất cơ sở. Cặp này là một đơn vị.
    - beats: [14, 15, 16]
      reason: >-
        Cặp quan trọng nhất trong bài. Beat 14 nói VACUUM CÓ dọn phiên bản chết. Beat 15 nói
        nó KHÔNG trả chỗ về hệ điều hành. Beat 16 là hệ quả quan sát được. Bỏ beat 15 là dạy
        NGƯỢC HOÀN TOÀN - beat 14 đứng một mình dẫn thẳng tới kết luận "vậy file sẽ nhỏ lại",
        đúng cái hiểu lầm cả video đang sửa.
    - beats: [31, 32, 33]
      reason: >-
        Beat 31 nêu VACUUM FULL là cách duy nhất làm file nhỏ lại. Beat 32 và 33 nêu giá của
        nó: khoá bảng ở mức cao nhất, và cần thêm đĩa đúng lúc đĩa đang thiếu. Bỏ beat 32
        hoặc 33 là biến một thao tác khoá bảng production thành một lời khuyên vô hại.

technical_notes:
  - >-
    Câu "file không nhỏ đi một byte" đúng TRONG PHẠM VI kịch bản. Doc Postgres nêu một ngoại
    lệ: nếu một hoặc vài trang ở CUỐI bảng trống hẳn VÀ lấy được exclusive lock dễ dàng, thì
    VACUUM thường CÓ trả chỗ về hệ điều hành. Trên bảng đang chịu ghi liên tục - đúng loại
    bảng video đang nói - cả hai điều kiện đều không thoả.
  - >-
    Phân biệt "phiên bản chết" với "dòng chết". Doc dùng cả hai: "dead row versions" ở phần
    vacuuming và "dead rows" trong mô tả n_dead_tup. Chúng chỉ cùng một thứ. Điểm dễ nhầm:
    n_dead_tup KHÔNG đếm bản ghi nghiệp vụ đã bị xoá - nó đếm phiên bản dòng không còn nhìn
    thấy được, mà phần lớn sinh ra từ UPDATE chứ không từ DELETE.
  - >-
    autovacuum và VACUUM là hai thứ khác nhau và narration nối chúng ở beat 13: autovacuum là
    tiến trình nền, VACUUM là lệnh mà nó chạy. Không nối hai từ này là để phía sau tự hoà
    giải hai thuật ngữ - đúng lỗi mà vòng feedback F01 chỉ ra.
  - >-
    Video chỉ nói một trong hai lý do VACUUM tồn tại. Lý do thứ hai là chống transaction ID
    wraparound - cơ chế riêng, hệ quả riêng, và là một video khác. Cắt có chủ ý.
  - >-
    Con số hai phần trăm cho scale factor là khuyến nghị của người viết, không phải giá trị
    trong doc. Narration nói rõ là "ví dụ". Giá trị đúng phải chỉnh theo từng bảng.
  - >-
    Video giới hạn ở bloat của BẢNG. Index phình theo cùng cơ chế và trong thực tế một index
    phình có thể nặng hơn cả bảng.

rejected_explanations:
  - explanation: "Postgres không bao giờ xoá row"
    reason: >-
      Sai theo nghĩa đen, và là cách nói phổ biến nhất về topic này. VACUUM CÓ xoá phiên bản
      chết. Dựng lại theo nghĩa đen thì người xem kết luận không có cách nào lấy lại chỗ, và
      bỏ luôn việc chỉnh autovacuum. Cách nói đúng phạm vi: Postgres không xoá NGAY, và chỉ
      xoá được khi phiên bản đó không còn nhìn thấy được với transaction nào.
  - explanation: "Chạy VACUUM là file nhỏ lại"
    reason: >-
      Sai. VACUUM thường đánh dấu chỗ tái dùng được bên trong bảng, không trả về hệ điều hành.
      Đây là hiểu lầm dẫn tới hành động sai rõ ràng nhất: người ta chạy VACUUM, nhìn dung
      lượng không đổi, rồi kết luận VACUUM hỏng hoặc bảng có vấn đề nghiêm trọng hơn.
  - explanation: "Bảng lớn nghĩa là bảng bị bloat"
    reason: >-
      Sai. Bloat là CHÊNH LỆCH giữa chỗ file chiếm và chỗ dữ liệu sống cần, không phải kích
      thước tuyệt đối. Nhầm chỗ này dẫn tới chạy VACUUM FULL trên những bảng chỉ đơn giản là
      có nhiều dữ liệu, tức là khoá bảng production để đổi lấy không gì cả.
  - explanation: "n_dead_tup về 0 nghĩa là hết bloat"
    reason: >-
      Sai, và nguy hiểm nhất trong bốn cái vì nó tạo cảm giác an toàn ngay tại công cụ mà
      người ta dùng để kiểm. n_dead_tup bằng 0 chỉ nói vừa dọn xong. Mốc nước cao nhất mà file
      đã đạt tới thì vẫn nguyên. Cách nói đúng: muốn biết có bloat không thì so kích thước
      file với chỗ mà n_live_tup cần, chứ không nhìn n_dead_tup.

sources:
  - title: "PostgreSQL - Routine Vacuuming"
    url: "https://www.postgresql.org/docs/current/routine-vacuuming.html"
    supports: >-
      UPDATE/DELETE không xoá ngay phiên bản cũ, và lý do là MVCC với điều kiện còn-nhìn-thấy-được.
      VACUUM thường không trả chỗ về hệ điều hành, trừ ngoại lệ trang cuối bảng. Công thức
      ngưỡng autovacuum. Cách tìm transaction mở lâu qua age(backend_xmin).
    kind: primary
  - title: "PostgreSQL - VACUUM"
    url: "https://www.postgresql.org/docs/current/sql-vacuum.html"
    supports: >-
      VACUUM thường chạy song song với đọc ghi bình thường và không lấy exclusive lock, chỗ
      được giữ để tái dùng trong chính bảng. VACUUM FULL viết lại bảng, trả chỗ về hệ điều
      hành, cần ACCESS EXCLUSIVE lock và cần thêm đĩa.
    kind: primary
  - title: "PostgreSQL - Automatic Vacuuming parameters"
    url: "https://www.postgresql.org/docs/current/runtime-config-autovacuum.html"
    supports: >-
      Giá trị mặc định: autovacuum_vacuum_threshold 50 dòng, autovacuum_vacuum_scale_factor
      0.2 tức 20 phần trăm kích thước bảng, autovacuum_vacuum_max_threshold 100 triệu dòng,
      autovacuum_naptime một phút.
    kind: primary
  - title: "PostgreSQL - CREATE TABLE storage parameters"
    url: "https://www.postgresql.org/docs/current/sql-createtable.html"
    supports: "autovacuum_vacuum_scale_factor và autovacuum_vacuum_threshold có bản per-table dưới dạng storage parameter"
    kind: primary
  - title: "PostgreSQL - Monitoring Statistics"
    url: "https://www.postgresql.org/docs/current/monitoring-stats.html"
    supports: >-
      Tên và nghĩa các cột n_live_tup, n_dead_tup, last_autovacuum, autovacuum_count trong
      pg_stat_all_tables, và backend_xmin trong pg_stat_activity.
    kind: primary

confidence: high

open_questions:
  - >-
    Chưa verify HOT update từ doc. Đó là nhánh quan trọng - nếu UPDATE không đụng cột được
    index và trang còn chỗ thì phiên bản mới nằm cùng trang và index không phình theo. Nếu
    làm video tiếp về index bloat thì phải đọc doc HOT trước.
  - >-
    Chưa có cơ sở để nói giá trị scale factor nào là hợp lý cho từng cỡ bảng. Video cố ý chỉ
    nêu hai phần trăm như một ví dụ và nói rõ phải chỉnh theo từng bảng.
  - >-
    Chưa khảo sát công cụ đo bloat trực tiếp. Nếu có một cách đo được chênh lệch giữa kích
    thước file và chỗ dữ liệu sống cần, đó sẽ là tín hiệu tốt hơn hẳn cặp n_dead_tup và
    last_autovacuum mà video đang dùng.

