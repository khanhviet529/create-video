schema_version: 1
id: "006"
topic: "PostgreSQL MVCC bloat - dead tuple, thu hồi bị trì hoãn, và mốc nước cao nhất"
domain: database
audience: "vietnamese software engineers, 2-5+ years"

format:
  kind: tiktok
  recommended_duration_sec: 157
  minimum_duration_sec: 130
  reason_for_duration: >-
    Topic này không có sự cố nên không có cú hích nào kéo người xem đi giúp - mọi thứ phải
    do chuỗi nhân quả tự kéo. Bốn thứ không nén được. Một, phải tách bạch "chưa được thu hồi"
    với "đã thu hồi nhưng không trả về hệ điều hành"; gộp hai cái là dạy sai cả bài. Hai,
    điều kiện thu hồi cần một beat riêng - ngưỡng hai mươi phần trăm và quy nó ra hai trăm
    nghìn dòng - vì thiếu nó thì việc bảng phải mang chỗ dư trở thành vô lý. Ba, khoảnh khắc
    lật cần ba beat liền: dọn thật, không trả về OS, file không đổi; bỏ beat giữa là dạy
    ngược hoàn toàn. Bốn, VACUUM FULL không được nhắc mà không kèm giá của nó, nếu không
    video vừa dạy người ta khoá bảng production. Dưới 130 giây là mất một trong bốn. Bản
    cuối ra 157 giây và không có beat nào được kéo dài cho đủ.

why_this_matters: >-
  Đây là loại vấn đề không bao giờ có một khoảnh khắc hỏng để cảnh báo. Không exception,
  không alert, không ai trực đêm bị gọi dậy. Chỉ có một con số lớn dần trong nhiều tháng, và
  bốn cách giải thích sai phổ biến tới mức chúng thường được dùng để trấn an nhau.

core_claim: "Kích thước file của một bảng Postgres là mốc nước cao nhất nó từng cần, không phải phép đo dữ liệu đang sống trong đó."

viewer_should_understand: >-
  VACUUM làm chỗ chết thành chỗ dùng lại được bên trong bảng, chứ không trả chỗ về hệ điều
  hành - nên bảng ngừng lớn chứ không nhỏ lại.

assumptions:
  - "PostgreSQL với cấu hình autovacuum mặc định"
  - "Một bảng bị UPDATE nhiều lần trên cùng những dòng - bảng trạng thái, bảng đếm, bảng session"
  - "Số dòng sống gần như đứng yên: mỗi UPDATE không thêm dòng mới về mặt nghiệp vụ"
  - "Kịch bản dùng cỡ một triệu dòng và khoảng thời gian sáu tháng - hai con số này là tham số kịch bản, không phải số đo"
  - "Không chạy VACUUM FULL trong khoảng thời gian đó"
  - "Không có transaction mở rất lâu - trường hợp có được nói riêng ở một beat trong narration"

technical_truth:
  mechanism_summary: >-
    Mỗi UPDATE ghi một phiên bản mới của dòng và đánh dấu phiên bản cũ là đã chết. Phiên bản
    chết không được xoá chừng nào nó còn có thể nhìn thấy được với một transaction khác - đó
    là điều kiện để MVCC hoạt động. Autovacuum chỉ dọn khi số dòng chết đạt ngưỡng, mặc định
    là hai mươi phần trăm số dòng của bảng. Khi dọn, nó đánh dấu chỗ đó dùng lại được BÊN
    TRONG bảng chứ không trả về hệ điều hành. Kết quả: file lớn lên theo lượng dữ liệu đồng
    thời lớn nhất bảng từng phải chứa, rồi đứng yên ở đó.
  invariant_broken: "Kích thước file tỉ lệ với lượng dữ liệu đang sống, và dọn dữ liệu chết thì dung lượng giảm"
  primary_fix: >-
    Hạ ngưỡng thu hồi cho riêng bảng nóng bằng storage parameter per-table - ví dụ đặt
    autovacuum_vacuum_scale_factor xuống 0.02 thay vì mặc định 0.2. Thu hồi xảy ra sớm hơn,
    nên chỗ chết được tái dùng trước khi bảng phải xin thêm chỗ mới từ hệ điều hành.
  fix_unchanged: >-
    Số phiên bản chết sinh ra không giảm đi chút nào - mỗi UPDATE vẫn tạo một phiên bản mới.
    File vẫn không bao giờ tự nhỏ lại. Câu query, lược đồ, code ứng dụng, và mọi thứ ở tầng
    nghiệp vụ đều giữ nguyên. Đây KHÔNG phải cách lấy lại chỗ đã mất.
  fix_enables: >-
    Mốc nước cao nhất bị giữ thấp ngay từ đầu. Đó là điều duy nhất thật sự kiểm soát được,
    vì mốc nước một khi đã lên thì chỉ có viết lại cả bảng mới hạ được.
  fix_tradeoff: >-
    Autovacuum chạy thường xuyên hơn nên tốn I/O và CPU đều hơn, và trên bảng gần như chỉ
    INSERT thì đó là công quét vô ích. Với bảng rất lớn, hai phần trăm vẫn là rất nhiều dòng
    nhưng tần suất quét tăng đáng kể - con số phải chỉnh theo từng bảng chứ không có giá trị
    đúng cho mọi nơi.
  detection:
    signal: >-
      Trong pg_stat_user_tables, đọc n_dead_tup cùng với last_autovacuum. Dòng chết cao KÈM
      lần autovacuum gần nhất đã cũ nghĩa là thu hồi không theo kịp, hoặc đang bị chặn.
    interpretation: >-
      Cặp tín hiệu đó thu hẹp về hai khả năng: autovacuum không đủ tần suất cho nhịp ghi của
      bảng, hoặc có một transaction mở lâu đang giữ chân toàn bộ. Phân biệt hai cái bằng cách
      kiểm age(backend_xmin) trong pg_stat_activity.
    false_positives:
      - "Autovacuum vừa bị hoãn vì đang bận bảng khác"
      - "Bảng vừa qua một đợt ghi lớn và ngưỡng hai mươi phần trăm chưa tới"
      - "Bảng đơn giản là lớn thật, không có bloat nào"
      - "Một transaction mở lâu đang chặn, và đó là vấn đề khác với autovacuum yếu"
    does_not_prove: >-
      n_dead_tup cao KHÔNG chứng minh bảng đang bloat - có thể autovacuum sắp chạy và chỗ đó
      sắp được tái dùng. Quan trọng hơn và hay bị nhầm nhất: n_dead_tup bằng 0 KHÔNG chứng
      minh không bloat, nó chỉ nói vừa dọn xong, còn file vẫn giữ nguyên mốc nước cao nhất từ
      trước. Bảng lớn KHÔNG chứng minh bloat, vì bloat là chênh lệch chứ không phải kích
      thước. Và last_autovacuum mới KHÔNG chứng minh vacuum đã thu hồi được gì - nếu có
      transaction cũ chặn thì nó chạy xong mà không dọn được.
  alternatives:
    - name: "Giảm tốc độ sinh phiên bản chết"
      solves: "chạm vào chính nguồn của sự tích tụ - ít thứ phải thu hồi thì autovacuum mặc định đủ dùng"
      cost: "đổi lược đồ hoặc đổi cách ứng dụng ghi - đắt nhất trong bốn cách"
      not_equivalent_because: >-
        Đây là cách duy nhất làm giảm TỔNG lượng việc. Ba cách kia chỉ đổi thời điểm hoặc
        điều kiện thu hồi. Không hợp khi nhịp cập nhật là bản chất của nghiệp vụ.
    - name: "Kết thúc transaction mở lâu"
      solves: >-
        chạm vào điều kiện còn-nhìn-thấy-được. Đây là cách DUY NHẤT xử lý được trường hợp
        autovacuum vẫn chạy, vẫn báo xong, mà số dòng chết không giảm.
      cost: "ứng dụng phải không giữ transaction mở; tìm bằng age(backend_xmin) trong pg_stat_activity"
      not_equivalent_because: >-
        Nó đổi cái mà vacuum ĐƯỢC PHÉP thu hồi, không đổi lịch chạy. Hạ ngưỡng không cứu được
        trường hợp này - vacuum sẽ chỉ chạy thường xuyên hơn mà vẫn không dọn được gì. Không
        hợp khi có workload cần snapshot lâu chính đáng như báo cáo dài hay logical replication.
    - name: "VACUUM FULL để trả chỗ về hệ điều hành"
      solves: "chạm vào chính mốc nước - đây là cách duy nhất làm file thật sự nhỏ lại"
      cost: >-
        Cần ACCESS EXCLUSIVE lock trên bảng suốt thời gian chạy. Và cần THÊM đĩa, vì nó viết
        một bản sao mới và không thả bản cũ cho tới khi xong.
      not_equivalent_because: >-
        Nó không đụng gì tới nguyên nhân - bảng sẽ lớn lại đúng như cũ. Đây là thao tác cho
        cửa sổ bảo trì. Trớ trêu: lúc đĩa gần đầy chính là lúc khó chạy nó nhất, vì nó cần
        thêm đĩa.
  edge_cases:
    - "Bảng gần như chỉ INSERT: hầu như không sinh phiên bản chết, hiện tượng không xảy ra."
    - "Ngoại lệ trong doc: nếu một hoặc vài trang ở CUỐI bảng trống hẳn VÀ lấy được exclusive lock dễ dàng, thì VACUUM thường CÓ trả chỗ về hệ điều hành. Trên bảng đang chịu ghi liên tục thì cả hai điều kiện đều không thoả."
    - "Index phình theo cùng cơ chế, và một index phình có thể nặng hơn cả bảng. Video giới hạn ở bảng."
    - "DELETE hàng loạt rồi không ghi lại: chỗ trống được đánh dấu tái dùng nhưng không có gì ghi vào, nên file cứ to mãi."
    - "Bảng nhỏ: ngưỡng 50 dòng chi phối chứ không phải 20%, nên bảng nhỏ được dọn rất thường xuyên."
    - "Bảng cực lớn: trần autovacuum_vacuum_max_threshold mặc định 100 triệu dòng chi phối, nên tỉ lệ dòng chết cần thiết thấp hơn 20%."
    - "Wraparound: doc nêu đây là lý do thứ hai VACUUM tồn tại. Cơ chế riêng, hệ quả riêng, không nằm trong video này."

story:
  incident: >-
    Bảng đơn hàng có một triệu dòng. Sáu tháng trước cũng khoảng một triệu. Dung lượng thì
    tăng đều suốt sáu tháng đó. Số dòng đứng yên, chỗ nó chiếm thì không.
  evidence: >-
    Autovacuum vẫn chạy bình thường và số dòng chết vẫn về gần không sau mỗi lần. Kích thước
    file thì không giảm một byte nào sau bất kỳ lần dọn nào.
  mechanism:
    - "Trạng thái ban đầu: bảng có một triệu dòng sống, file chiếm đúng chỗ chừng ấy dòng cần"
    - "Trong sáu tháng, mỗi đơn hàng bị UPDATE vài lần - đổi trạng thái, gắn mã vận đơn, cập nhật thời gian giao"
    - "UPDATE không sửa dòng tại chỗ: nó ghi một phiên bản mới rồi đánh dấu phiên bản cũ là đã chết - đây là nguyên nhân"
    - "Phiên bản chết không được xoá chừng nào nó còn có thể nhìn thấy được với một transaction khác, vì đó là điều kiện để MVCC hoạt động - đây là điều kiện thường trực, không phải nguyên nhân"
    - "Số dòng sống không đổi, nhưng số phiên bản tồn tại vật lý trong file thì tăng"
    - "Autovacuum có dọn, nhưng chỉ khi số dòng chết đạt ngưỡng - mặc định là hai mươi phần trăm số dòng của bảng, tức khoảng hai trăm nghìn phiên bản chết với bảng này"
    - "Autovacuum tới lượt và chạy VACUUM: nó dọn phiên bản chết thật, số dòng chết về gần không"
    - "Nhưng VACUUM đánh dấu chỗ đó là dùng lại được BÊN TRONG bảng, không trả về hệ điều hành - nên file không nhỏ đi một byte"
    - "Chỗ trống bên trong được tái dùng cho lần ghi sau, nên bảng đạt trạng thái ổn định: ngừng lớn, nhưng không nhỏ lại"
  aha:
    viewer_thinks: "Kích thước file đo lượng dữ liệu đang sống trong bảng."
    actually: >-
      Nó là mốc nước cao nhất - lượng dữ liệu đồng thời lớn nhất mà bảng từng phải chứa. Mốc
      nước thì chỉ đi lên.
  concept_name: "bloat - chênh lệch giữa chỗ file chiếm và chỗ dữ liệu sống cần"
  fix: >-
    Hạ ngưỡng thu hồi cho riêng bảng nóng, ví dụ đặt scale factor xuống hai phần trăm thay vì
    hai mươi. Thu hồi sớm hơn thì mốc nước bị giữ thấp.
  tradeoff: >-
    Autovacuum chạy thường hơn và tốn I/O đều hơn. Với bảng gần như chỉ INSERT thì đó là công
    cốc. Và nó không lấy lại được chỗ đã mất - muốn thế phải viết lại cả bảng bằng VACUUM
    FULL, thứ khoá bảng ở mức cao nhất và còn cần thêm đĩa.
  detection: >-
    Nhìn n_dead_tup cùng last_autovacuum trong pg_stat_user_tables. Dòng chết cao kèm lần dọn
    gần nhất đã cũ nghĩa là thu hồi không theo kịp hoặc đang bị chặn. Nhưng dòng chết bằng
    không không chứng minh bảng không bloat - nó chỉ nói vừa dọn xong.
  ending_question: "Trong database của bạn, bảng nào có số dòng đứng yên mà dung lượng vẫn tăng?"

semantic_model:
  entities:
    - id: app
      type: client
      label: "Ứng dụng cập nhật trạng thái đơn hàng"
    - id: orders_table
      type: datastore
      label: "Bảng đơn hàng, một triệu dòng sống"
    - id: table_file
      type: component
      label: "File trên đĩa mà bảng đang chiếm"
    - id: autovacuum
      type: process
      label: "Tiến trình autovacuum của Postgres"
    - id: open_txn
      type: process
      label: "Transaction mở lâu - nhánh riêng, không thuộc kịch bản chính"

  states:
    - entity: orders_table
      field: live_rows
      initial: 1000000
      timeline: [1000000, 1000000, 1000000, 1000000, 1000000, 1000000, 1000000, 1000000, 1000000]
    - entity: orders_table
      field: dead_versions
      initial: "0"
      timeline: ["0", "0", "0", "tăng dần", "tăng dần", "bị giữ lại vì còn nhìn thấy được", "gần 0", "gần 0", "dao động dưới ngưỡng"]
    - entity: table_file
      field: size_relative_to_live_data
      initial: "vừa đủ"
      timeline: ["vừa đủ", "vừa đủ", "vừa đủ", "đang tăng", "đang tăng", "đang tăng", "đang tăng", "không đổi sau khi dọn", "đứng yên ở mốc cao nhất"]

  events:
    - id: e1
      t: 0
      role: precondition
      actor: orders_table
      action: retain_versions_while_visible
      detail: >-
        MVCC: một phiên bản dòng không được xoá chừng nào nó còn có thể nhìn thấy được với
        một transaction khác. Luôn đúng, kể cả khi không có bloat. Bỏ nó thì cơ chế không tồn
        tại, nhưng bản thân nó không gây ra bloat.
      causes: []
    - id: e2
      t: 0
      role: precondition
      actor: autovacuum
      action: wait_for_threshold
      target: orders_table
      detail: >-
        Ngưỡng mặc định là 50 dòng cộng 20 phần trăm số dòng của bảng. Với một triệu dòng thì
        là khoảng hai trăm nghìn. Đây là một hằng số cấu hình - nó ĐỊNH CỠ sự tích tụ chứ
        không tạo ra nó.
      causes: []
    - id: e3
      t: 1
      role: primary_cause
      actor: app
      action: update_rows_repeatedly
      target: orders_table
      detail: >-
        Mỗi UPDATE ghi một phiên bản mới của dòng và đánh dấu phiên bản cũ là đã chết. Bỏ
        hành động này ra thì không có gì tích tụ.
      causes: [e4]
    - id: e4
      t: 2
      role: consequence
      actor: orders_table
      action: accumulate_dead_versions
      detail: "Số dòng sống không đổi. Số phiên bản tồn tại vật lý trong file thì tăng."
      causes: [e5]
    - id: e5
      t: 3
      role: consequence
      actor: table_file
      action: grow_to_hold_live_and_dead
      detail: "File xin thêm chỗ từ hệ điều hành để chứa cả phiên bản sống lẫn phiên bản chết."
      causes: [e8]
    - id: e6
      t: 4
      role: supporting_evidence
      actor: open_txn
      action: hold_visibility_horizon
      target: orders_table
      detail: >-
        Nhánh riêng: một transaction mở lâu giữ các phiên bản chết ở trạng thái còn nhìn thấy
        được với nó. Autovacuum vẫn chạy, vẫn báo xong, và vẫn không thu hồi được gì. Đây
        giải thích trường hợp "vacuum chạy mà vô ích", không phải cơ chế chính.
      causes: []
    - id: e7
      t: 5
      role: mitigation
      actor: autovacuum
      action: remove_dead_versions_mark_reusable
      target: orders_table
      detail: >-
        Dọn phiên bản chết thật, và đánh dấu chỗ đó là dùng lại được BÊN TRONG bảng. Không
        trả chỗ về hệ điều hành.
      causes: [e8]
    - id: e8
      t: 6
      role: invariant_violation
      actor: table_file
      action: retain_size_after_reclaim
      detail: >-
        Số dòng chết về gần không, kích thước file không đổi. Kỳ vọng bị phá là "dọn dữ liệu
        chết thì dung lượng trên đĩa giảm".
      causes: []
    - id: e9
      t: 7
      role: consequence
      actor: orders_table
      action: reach_steady_state
      detail: >-
        Chỗ trống bên trong được tái dùng cho lần ghi sau, nên bảng ngừng lớn. Nó chỉ không
        nhỏ lại.
      causes: []

  relationships:
    - from: app
      to: orders_table
      kind: writes
    - from: orders_table
      to: table_file
      kind: contains
    - from: autovacuum
      to: orders_table
      kind: reads_writes
    - from: open_txn
      to: orders_table
      kind: reads

  invariants:
