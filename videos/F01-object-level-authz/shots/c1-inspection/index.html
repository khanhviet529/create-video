<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* @brand:start */
:root {
  --ground: #0C0D0F; --ground-lift: #14161A;
  --ink: #EDEAE4; --ink-mid: #9AA0A6; --ink-dim: #8B9198; --ink-ghost: #3A3E42;
  --rule: #23272A; --rule-bright: #3D4348; --hair: 1.5px;
  --authoritative: #C9A227; --stale: #E0533D; --lost: #6A6F74;
  --boundary: #4E8C7D; --pressure: #B4623A; --counterfactual: #7A8086;
  --font-value: "IBM Plex Mono", ui-monospace, monospace;
  --font-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --t-hero: 200px; --t-value: 64px; --t-body: 36px; --t-label: 26px; --track-label: 0.18em;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-label); }
.label { font-family: var(--font-label); font-size: var(--t-label); letter-spacing: var(--track-label);
         text-transform: uppercase; color: var(--ink-dim); font-weight: 500; }
/* @brand:end */

html, body { width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; }
.mono { position: absolute; font-family: var(--font-value); line-height: 1; white-space: pre; }
.sans { position: absolute; font-family: var(--font-label); letter-spacing: 0.01em; font-weight: 600; }

/* ---------------------------------------------------------------------------
   c1 — INSPECTION. Composition prototype for the s01 / s05 family.
   Mass: centre band, full width, clipped right. Edges: thin annotation only.
--------------------------------------------------------------------------- */
#meta { left: 60px; top: 200px; font-size: 30px; color: var(--ink-mid); }
#meta em { font-style: normal; color: var(--stale); font-weight: 600; }
.cmt  { left: 60px; font-size: 44px; color: var(--ink); }
#who  { position: absolute; left: 60px; top: 1290px; width: 960px; color: var(--stale);
        line-height: 1.3; }
#wrong{ left: 60px; top: 1370px; width: 960px; font-size: 50px; color: var(--ink); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9"
     data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="0">
    <div class="mono" id="meta">GET /documents/d41/comments  &rarr;  <em>200</em></div>
    <div class="mono cmt" id="l1" style="top:812px">"ngân sách Q4 chốt ở mức 4.2 tỷ, chưa gồm headcount"</div>
    <div class="mono cmt" id="l2" style="top:890px">"đừng forward file này ra ngoài team"</div>
    <div class="mono cmt" id="l3" style="top:968px">"bản cũ có số sai, dùng bản ngày 14 nhé"</div>
    <div class="mono cmt" id="l4" style="top:1046px">"lịch họp với đối tác dời sang thứ năm tuần sau"</div>
    <div id="who" class="label">người gửi request đã bị xoá khỏi workspace ba tháng trước</div>
    <div class="sans" id="wrong">họ vẫn đọc được</div>
  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = 'power3.out', T = 'power2.inOut';
gsap.set(['#meta','#l1','#l2','#l3','#l4','#who','#wrong'], { opacity: 0 });
tl.to('#meta', { opacity: 1, duration: .35, ease: R }, 0.25)
  .to(['#l1','#l2','#l3','#l4'], { opacity: 1, duration: .3, ease: R, stagger: .34 }, 0.90)
  .to('#who', { opacity: 1, duration: .45, ease: R }, 4.30)
  .to('#wrong', { opacity: 1, duration: .5, ease: R }, 6.40);
window.__timelines['main'] = tl;
</script>
</body>
</html>
