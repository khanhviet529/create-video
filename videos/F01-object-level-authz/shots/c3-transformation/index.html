<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* @brand:start */
:root {
  --ground: #0C0D0F; --ground-lift: #14161A;
  --ink: #EDEAE4; --ink-mid: #9AA0A6; --ink-dim: #8B9198; --ink-ghost: #3A3E42;
  --rule: #23272A; --rule-bright: #3D4348; --hair: 1.5px;
  --authoritative: #C9A227; --stale: #E0533D; --lost: #6A6F74;
  --boundary: #4E8C7D; --pressure: #B4623A; --counterfactual: #7A8086;
  --font-value: "IBM Plex Mono", ui-monospace, monospace;
  --font-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --t-hero: 200px; --t-value: 64px; --t-body: 36px; --t-label: 26px; --track-label: 0.18em;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-label); }
.label { font-family: var(--font-label); font-size: var(--t-label); letter-spacing: var(--track-label);
         text-transform: uppercase; color: var(--ink-dim); font-weight: 500; }
/* @brand:end */

html, body { width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; }
.mono { position: absolute; font-family: var(--font-value); line-height: 1; white-space: pre; }
.sans { position: absolute; font-family: var(--font-label); letter-spacing: 0.01em; font-weight: 600; }

/* ---------------------------------------------------------------------------
   c3 — TRANSFORMATION. Composition prototype for s10.
   Premise at the top edge, mass at the optical centre, attribution at the bottom edge.
--------------------------------------------------------------------------- */
#invLbl  { position: absolute; left: 93px; top: 236px; }
#invText { position: absolute; left: 93px; top: 286px; width: 894px; font-family: var(--font-label);
           font-size: 34px; line-height: 1.2; letter-spacing: 0.01em; color: var(--ink); font-weight: 600; }
#dLbl { position: absolute; left: 404px; top: 980px; }
#dA   { left: 289px; top: 1042px; font-size: 44px; color: var(--ink); }
#dB1  { left: 355px; top: 1128px; font-size: 44px; color: var(--stale); }
#dB2  { left: 408px; top: 1128px; font-size: 44px; color: var(--boundary); }
#src  { position: absolute; left: 93px; top: 1430px; color: var(--lost); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10"
     data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0">
    <div id="invLbl" class="label">bất biến phải giữ</div>
    <div id="invText">mọi truy cập tới object được bảo vệ đều phải chịu quyết định phân quyền cần thiết</div>

    <div id="dLbl" class="label">mặc định</div>
    <div class="mono" id="dA">không có quyết định</div>
    <div class="mono" id="dB1">&rarr;  trả dữ liệu</div>
    <div class="mono" id="dB2">&rarr;  từ chối</div>

    <div id="src" class="label">owasp top 10 2021 &middot; a01 broken access control</div>
  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = 'power3.out', T = 'power2.inOut';
gsap.set(['#invLbl','#invText','#dLbl','#dA','#dB1','#dB2','#src'], { opacity: 0 });
tl.to('#invLbl', { opacity: 1, duration: .4, ease: R }, 0.25)
  .to('#invText', { opacity: 1, duration: .5, ease: R }, 0.45);
tl.to('#dLbl', { opacity: 1, duration: .35, ease: R }, 2.20)
  .to('#dA', { opacity: 1, duration: .4, ease: R }, 2.50)
  .to('#dB1', { opacity: 1, duration: .4, ease: R }, 2.95);
/* the flip: dA never moves, only the second term is replaced */
tl.to('#dB1', { opacity: 0, duration: .45, ease: 'power2.in' }, 4.90)
  .to('#dB2', { opacity: 1, duration: .5, ease: R }, 5.20);
tl.to('#src', { opacity: 1, duration: .4, ease: R }, 6.80);
window.__timelines['main'] = tl;
</script>
</body>
</html>
