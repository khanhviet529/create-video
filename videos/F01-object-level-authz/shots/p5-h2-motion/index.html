<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* @brand:start */
:root {
  --ground: #0C0D0F; --ground-lift: #14161A;
  --ink: #EDEAE4; --ink-mid: #9AA0A6; --ink-dim: #8B9198; --ink-ghost: #3A3E42;
  --rule: #23272A; --rule-bright: #3D4348; --hair: 1.5px;
  --authoritative: #C9A227; --stale: #E0533D; --lost: #6A6F74;
  --boundary: #4E8C7D; --pressure: #B4623A; --counterfactual: #7A8086;
  --font-value: "IBM Plex Mono", ui-monospace, monospace;
  --font-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --t-hero: 200px; --t-value: 64px; --t-body: 36px; --t-label: 26px; --track-label: 0.18em;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-label); }
.label { font-family: var(--font-label); font-size: var(--t-label); letter-spacing: var(--track-label);
         text-transform: uppercase; color: var(--ink-dim); font-weight: 500; }
/* @brand:end */

html, body { width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; }

/* ---------------------------------------------------------------------------
   P5 — H2 MOTION, resolved. Prototype, not a shot.

   p2-aha put the two facts in the SAME column across two passes, one fading as the
   other arrived. A still frame cannot tell you whether that reads as two facts or
   as one thing turning into another, and "req.principal becomes assertMember" is a
   lie the shot must not be able to tell.

   Resolved structurally rather than by easing: TWO COLUMNS THAT COEXIST. Identity
   arrives on all four paths and never leaves. Authorization coverage arrives beside
   it, in its own column, on one path. Nothing crossfades, nothing shares a
   position, nothing is removed — so there is no substitution available to read.

   The relationship on screen is additive, which is the relationship:
       identity context exists broadly
     + protected object accesses still require authorization coverage

   Column arithmetic, checked not guessed. Routes shortened to /docs so the longest
   is 18 chars: at 34px that is 367px, ending at 460. Identity column at 500 holds
   `req.principal` (265px) to 765. Authorization column at 800 holds `assertMember`
   (245px) to 1045, inside the 1080 frame.
--------------------------------------------------------------------------- */
#lblTop { position: absolute; left: 93px; top: 244px; width: 894px; }

#hdrId  { position: absolute; left: 500px; top: 336px; color: var(--boundary); }
#hdrAz  { position: absolute; left: 800px; top: 336px; color: var(--authoritative); }

.p   { position: absolute; left: 93px; font-family: var(--font-value); font-size: 34px;
       line-height: 1; color: var(--ink-mid); white-space: pre; }
.id  { position: absolute; left: 500px; font-family: var(--font-value); font-size: 34px;
       line-height: 1; color: var(--boundary); white-space: pre; }
.az  { position: absolute; left: 800px; font-family: var(--font-value); font-size: 34px;
       line-height: 1; color: var(--authoritative); font-weight: 600; white-space: pre; }

.close { position: absolute; left: 93px; width: 894px; font-family: var(--font-label);
         font-size: 40px; letter-spacing: 0.01em; font-weight: 600; }
#c1 { top: 800px; color: var(--boundary); }
#c2 { top: 860px; color: var(--authoritative); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9"
     data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="0">

    <div id="lblTop" class="label">bốn đường http tới cùng tài liệu</div>

    <div id="hdrId" class="label">danh tính</div>
    <div id="hdrAz" class="label">phân quyền</div>

    <div id="rows"></div>

    <div class="close" id="c1">danh tính có ở mọi đường</div>
    <div class="close" id="c2">truy cập tới object vẫn cần quyết định riêng</div>

  </div>
</div>

<script>
const PATHS = ['/docs/:id', '/docs/:id/comments', '/docs/:id/history', '/docs/:id/exports'];
const COVERED = [0];
const TOP = 420, PITCH = 80;

const host = document.getElementById('rows');
const pathEls = [], idEls = [], azEls = [];
PATHS.forEach((p, i) => {
  const y = (TOP + i * PITCH) + 'px';
  const a = document.createElement('div'); a.className = 'p';  a.style.top = y; a.textContent = p;
  const b = document.createElement('div'); b.className = 'id'; b.style.top = y; b.textContent = 'req.principal';
  host.appendChild(a); host.appendChild(b); pathEls.push(a); idEls.push(b);
  if (COVERED.includes(i)) {
    const c = document.createElement('div'); c.className = 'az'; c.style.top = y; c.textContent = 'assertMember';
    host.appendChild(c); azEls.push(c);
  }
});

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = 'power3.out';

gsap.set([...pathEls, ...idEls, ...azEls], { opacity: 0 });
gsap.set(['#lblTop', '#hdrId', '#hdrAz', '#c1', '#c2'], { opacity: 0 });

/* ---- 0.25  the inventory ---------------------------------------------- */
tl.to('#lblTop', { opacity: 1, duration: .4, ease: R }, 0.25)
  .to(pathEls, { opacity: 1, duration: .26, ease: R, stagger: .16 }, 0.55);

/* ---- 1.60  identity arrives broadly, and STAYS ------------------------
   Fast stagger: nobody did anything for this to be here. Nothing in the rest of the
   timeline touches these elements again — that is the guarantee. */
tl.to('#hdrId', { opacity: 1, duration: .35, ease: R }, 1.60)
  .to(idEls, { opacity: 1, duration: .25, ease: R, stagger: .09 }, 1.75);

/* ---- 3.30  authorization coverage arrives BESIDE it -------------------
   Its own column, its own header. One path. Nothing is drawn beside the three that
   lack it — no placeholder. And nothing fades out to make room. */
tl.to('#hdrAz', { opacity: 1, duration: .35, ease: R }, 3.30)
  .to(azEls, { opacity: 1, duration: .35, ease: R }, 3.55);

/* ---- 5.00  the additive relationship, named --------------------------- */
tl.to('#c1', { opacity: 1, duration: .4, ease: R }, 5.00)
  .to('#c2', { opacity: 1, duration: .4, ease: R }, 5.70);

window.__timelines['main'] = tl;
</script>
</body>
</html>
