<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* @brand:start */
:root {
  --ground: #0C0D0F; --ground-lift: #14161A;
  --ink: #EDEAE4; --ink-mid: #9AA0A6; --ink-dim: #8B9198; --ink-ghost: #3A3E42;
  --rule: #23272A; --rule-bright: #3D4348; --hair: 1.5px;
  --authoritative: #C9A227; --stale: #E0533D; --lost: #6A6F74;
  --boundary: #4E8C7D; --pressure: #B4623A; --counterfactual: #7A8086;
  --font-value: "IBM Plex Mono", ui-monospace, monospace;
  --font-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --t-hero: 200px; --t-value: 64px; --t-body: 36px; --t-label: 26px; --track-label: 0.18em;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-label); }
.label { font-family: var(--font-label); font-size: var(--t-label); letter-spacing: var(--track-label);
         text-transform: uppercase; color: var(--ink-dim); font-weight: 500; }
/* @brand:end */

html, body { width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; }
.mono { position: absolute; font-family: var(--font-value); line-height: 1; white-space: pre; }
.sans { position: absolute; font-family: var(--font-label); letter-spacing: 0.01em; font-weight: 600; }

/* ---------------------------------------------------------------------------
   s14-limits — WHAT THE NUMBER DOES NOT PROVE. narrowing by LOSS OF WEIGHT.

   Opens on s14-signal's number at its exact coordinates. This shot is ABOUT that number, so
   the number is the one thing that carries across the cut; everything else is new and builds
   around it rather than above it. The frame fills downward from the number and then to the
   right, which is the reverse of this video's habit and is motivated by what was already on
   screen, not chosen for variety.

   The standing claim — "phân quyền của bạn đúng" — is never struck, because it is not false.
   It is simply not what a green test establishes. It arrives at full ink and loses a step of
   weight at each qualification that lands. Nothing is eliminated here and nothing contracts
   in width; that is what separates this from the other four narrowing shots.

   Grid deliberately unlike s14-signal's: 54px pitch against its 48, band at 560 against its
   580. Two tallies separated by a cut must not line up, or the cut reads as one count
   continuing rather than a different question being asked.
--------------------------------------------------------------------------- */
#pctLbl { position: absolute; left: 93px; top: 890px; width: 894px; }
#pct { left: 93px; top: 936px; font-size: 56px; color: var(--ink); }

#saysLbl { position: absolute; left: 93px; top: 1046px; }
#says { left: 93px; top: 1092px; width: 894px; font-size: 38px; color: var(--ink); }
#notLbl { position: absolute; left: 93px; top: 1170px; color: var(--stale); }
#claim { left: 93px; top: 1216px; width: 894px; font-size: 46px; color: var(--ink); }

#q1 { left: 560px; top: 470px; width: 460px; font-size: 34px; color: var(--ink-mid); line-height: 1.25; }
#limLbl { position: absolute; left: 560px; top: 640px; width: 460px; color: var(--lost); }
.m { left: 560px; font-size: 30px; color: var(--ink-mid); }
#http { position: absolute; left: 93px; top: 1330px; width: 894px; color: var(--lost); line-height: 1.3; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16"
     data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="16" data-track-index="0">

    <div id="pctLbl" class="label">phần trăm route đã có test đó</div>
    <div class="mono" id="pct">40%</div>

    <div id="saysLbl" class="label">con số đó nói</div>
    <div class="sans" id="says">còn đường nào chưa ai kiểm</div>
    <div id="notLbl" class="label">nó không nói</div>
    <div class="sans" id="claim">phân quyền của bạn đúng</div>

    <div class="sans" id="q1">test xanh chỉ chứng minh tài khoản trong fixture bị chặn</div>
    <div id="limLbl" class="label">còn lại là chuyện khác</div>
    <div class="mono m" id="m1" style="top:696px">cựu thành viên</div>
    <div class="mono m" id="m2" style="top:750px">quyền vừa thu hồi</div>
    <div class="mono m" id="m3" style="top:804px">vai trò lồng nhau</div>

    <div id="http" class="label">và không chạm tới đường nào không đi qua route http</div>

  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = 'power3.out', T = 'power2.inOut';

/* #pctLbl and #pct are s14-signal's closing state — visible at t=0, never tweened */
gsap.set(['#saysLbl','#says','#notLbl','#claim','#q1','#limLbl','#m1','#m2','#m3','#http'], { opacity: 0 });

/* beat 1 (0.00-4.80) — what the number says, then the claim it does not support */
tl.to('#saysLbl', { opacity: 1, duration: .3, ease: R }, 0.50)
  .to('#says', { opacity: 1, duration: .4, ease: R }, 0.80)
  .to('#notLbl', { opacity: 1, duration: .3, ease: R }, 2.70)
  .to('#claim', { opacity: 1, duration: .45, ease: R }, 3.00);

/* beat 2 (4.80-11.58) — qualifications land, and the claim loses a step of weight at each */
tl.to('#q1', { opacity: 1, duration: .45, ease: R }, 4.78)
  .to('#claim', { color: '#9AA0A6', duration: .6, ease: 'none' }, 5.28)
  .to('#limLbl', { opacity: 1, duration: .35, ease: R }, 6.98)
  .to('#m1', { opacity: 1, duration: .3, ease: R }, 7.38)
  .to('#m2', { opacity: 1, duration: .3, ease: R }, 8.58)
  .to('#claim', { color: '#6A6F74', duration: .7, ease: 'none' }, 8.58)
  .to('#m3', { opacity: 1, duration: .3, ease: R }, 9.78);

/* beat 3 (11.58-14.58) */
tl.to('#http', { opacity: 1, duration: .45, ease: R }, 10.92);

window.__timelines['main'] = tl;
</script>
</body>
</html>
